<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Page</title>
    <link rel="stylesheet" href="styles/product-page.css" />
  </head>
  <body>
    <div class="header">
      <div class="upper-header">
        <ul class="upper-nav">
          <li>
            <a href="#" class="upper-nav-item"
              ><img
                class="profile-icon"
                src="img/product-page-img/icons/profile.png"
                alt=""
              />
              <p>My Account</p>
            </a>
          </li>
          <li><a href="#" class="upper-nav-item">Blog</a></li>
          <li><a href="#" class="upper-nav-item">Newsletter</a></li>
          <li><a href="#" class="upper-nav-item">Help</a></li>
          <li>
            <a href="#" class="upper-nav-item"
              ><img src="img/product-page-img/icons/uk.png" alt="" />
              <p>United Kingdom</p>
              <img
                class="down-arrow"
                src="img/product-page-img/icons/down-arrow.png"
                alt=""
            /></a>
          </li>
        </ul>
      </div>
      <div class="lower-header">
        <div class="logo">
          <p>GYM <span>Fit</span></p>
        </div>
        <div class="products-nav-container">
          <ul class="products-nav">
            <li><a href="#" class="products-nav-item">Womens</a></li>
            <li><a href="#" class="products-nav-item">Mens</a></li>
            <li><a href="#" class="products-nav-item">Accessories</a></li>
          </ul>
        </div>
        <div class="section-nav-container">
          <ul class="section-nav">
            <li>
              <a href="#" class="section-nav-item"
                ><img src="img/product-page-img/icons/search.png" alt=""
              /></a>
            </li>
            <li>
              <a href="#" class="section-nav-item"
                ><img
                  src="img/product-page-img/icons/heart.png"
                  class="heart"
                  alt=""
              /></a>
            </li>
            <li>
              <a href="#" class="section-nav-item"
                ><img src="img/product-page-img/icons/profile.png" alt=""
              /></a>
            </li>
            <li>
              <a href="#" class="section-nav-item icon-wrapper">
                <img
                  src="img/product-page-img/icons/cart.png"
                  alt=""
                  class="cart"
                />
                <span class="badge">0</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <hr class="separation" />
    <div class="ad">
      <p class="ad-text">Free Returns now for 30 days*</p>
    </div>
    <hr class="separation" />
  </body>
</html>
